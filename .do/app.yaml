# DigitalOcean App Platform spec for the Penguin website.
# The site lives in public/, so in the control panel set Source directory to "public"
# (otherwise it reports "No components detected"). Or skip the wizard entirely:
#   doctl apps create --spec .do/app.yaml
name: penguin-website
static_sites:
  - name: web
    github:
      repo: "lightbulbmomentlabs/penguin-athletics"
      branch: main
      deploy_on_push: true
    source_dir: public
    index_document: index.html
    error_document: 404.html
