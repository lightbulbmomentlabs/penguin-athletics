# DigitalOcean App Platform spec for the Penguin website.
# Create the app in the control panel (Create App -> GitHub -> this repo) and paste this
# into the App Spec editor, or run: doctl apps create --spec .do/app.yaml
# Replace {{GITHUB_REPO}} with owner/name first, e.g. kevinfremon/penguin-website.
name: penguin-website
static_sites:
  - name: web
    github:
      repo: "{{GITHUB_REPO}}"
      branch: main
      deploy_on_push: true
    source_dir: public
    index_document: index.html
    error_document: 404.html
