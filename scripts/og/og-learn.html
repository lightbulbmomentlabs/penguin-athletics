<!DOCTYPE html>
<!-- Template for Learn share images. scripts/make_learn_og.py fills the {{...}} slots. Not served.
     Same look as the site and invite share images (og.html, og-join.html). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Learn share image</title>
<style>
  @font-face {
    font-family: "Nunito";
    src: url("../../public/assets/fonts/nunito-latin-wght.woff2") format("woff2");
    font-weight: 200 1000;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Nunito", sans-serif; color: #1c2440;
    background:
      radial-gradient(55% 60% at 88% 18%, rgba(255, 231, 163, 0.95), transparent 70%),
      linear-gradient(180deg, #ffc9b0 0%, #f8c6cc 58%, #ffe6d6 100%);
  }

  .brand { position: absolute; top: 56px; left: 64px; display: flex; align-items: center; gap: 14px; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; box-shadow: 0 4px 0 rgba(15, 20, 41, 0.12); }
  .brand span { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; }
  .brand small { font-size: 34px; font-weight: 700; opacity: 0.55; }

  .copy { position: absolute; top: 168px; left: 64px; width: 640px; }
  .title { font-size: 80px; font-weight: 900; line-height: 0.98; letter-spacing: -0.035em; }
  .sub { margin-top: 24px; font-size: 30px; font-weight: 700; line-height: 1.3; }
  .footer { position: absolute; left: 64px; bottom: 54px; font-size: 26px; font-weight: 800; opacity: 0.75; }

  .art { position: absolute; right: 60px; bottom: 44px; width: 380px; }
  .art img { display: block; width: 100%; position: relative; z-index: 1; }
  .floe {
    position: absolute; left: -12%; right: -12%; bottom: -18px; height: 60px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.8);
  }
  .speech {
    position: absolute; z-index: 2; top: -76px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    padding: 14px 22px; border-radius: 22px; background: #fff; white-space: nowrap;
    font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 rgba(15, 20, 41, 0.1);
  }
  .speech::after {
    content: ""; position: absolute; left: 50%; bottom: -13px; margin-left: -13px;
    border: 13px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="../../public/assets/apple-touch-icon.png" alt="">
    <span>Penguin</span> <small>· {{KICKER}}</small>
  </div>
  <div class="copy">
    <p class="title">{{TITLE}}</p>
    <p class="sub">{{SUB}}</p>
  </div>
  <p class="footer">penguinathletics.com/learn</p>
  <div class="art">
    <div class="floe"></div>
    <p class="speech">{{SPEECH}}</p>
    <img src="../../public/assets/img/{{POSE}}-640.webp" alt="">
  </div>
</body>
</html>
