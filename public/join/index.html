<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join my waddle · Penguin</title>
  <meta name="description" content="Walk with friends on Penguin. Poke the slackers.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fa8c7a">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <meta name="apple-itunes-app" content="app-id=6831137240">
  <meta property="og:site_name" content="Penguin Athletics">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://penguinathletics.com/join/">
  <meta property="og:title" content="You're invited to my waddle on Penguin">
  <meta property="og:description" content="Walk with friends. See who hit their goal. Poke the slackers.">
  <meta property="og:image" content="https://penguinathletics.com/assets/og/join.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Five cartoon penguins in a walking club, with goal check-ins and a poke. You're invited to the waddle.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You're invited to my waddle on Penguin">
  <meta name="twitter:description" content="Walk with friends. See who hit their goal. Poke the slackers.">
  <meta name="twitter:image" content="https://penguinathletics.com/assets/og/join.jpg">
</head>
<body>
<main class="lost join">
  <div class="wrap">
    <img src="/assets/img/invite-squad-360.webp"
         srcset="/assets/img/invite-squad-360.webp 360w, /assets/img/invite-squad-720.webp 720w"
         sizes="(min-width: 600px) 320px, 70vw" width="720" height="720"
         alt="Four penguins walking together across the ice.">
    <h1 id="title">Join the waddle</h1>
    <p>Walk with friends on Penguin. Poke the slackers.</p>
    <div class="join-actions">
      <a class="btn" id="open" href="penguin://home">Open in Penguin</a>
      <a class="app-store-badge" href="https://apps.apple.com/us/app/penguin-step-counter-pedometer/id6831137240"><img src="/assets/img/app-store-badge-black.svg" width="168" height="56" alt="Download on the App Store"></a>
    </div>
    <p class="fine">Penguin is free on iPhone. New here? Get it, then tap the invite again.</p>
  </div>
</main>
<script>
  // The app makes these links: /join/?c=<invite code>&n=<waddle name>.
  (function () {
    var q = new URLSearchParams(location.search);
    var code = q.get("c") || "";
    var name = (q.get("n") || "").trim();
    if (/^[A-Za-z0-9_-]{8,80}$/.test(code)) {
      document.getElementById("open").href = "penguin://join?c=" + code;
    }
    if (/^[\p{L}\p{N} '’.\-&!]{1,40}$/u.test(name)) {
      var title = "Join " + name;
      document.getElementById("title").textContent = title;
      document.title = title + " · Penguin";
    }
  })();
</script>
</body>
</html>
